services:
  postgres:
    image: postgres:17-alpine
    container_name: pms_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: pms_dev
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pms_dev"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: pms_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/pms_dev?schema=public
      JWT_SECRET: super_secret_jwt_key_at_least_32_characters_long
      JWT_EXPIRES_IN: 1d
      CORS_ORIGIN: http://localhost:5173,http://localhost:3000
      TRUST_PROXY_HOPS: 0
      PORT: 3000
      NODE_ENV: production
    ports:
      - "3000:3000"

volumes:
  postgres_data:
    name: pms_postgres_data
